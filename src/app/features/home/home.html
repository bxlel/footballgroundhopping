<div class="home">
  <section class="home__hero">
    <div class="home__inner">
      <h1 class="display">
        {{ t.home.headline }}
        <span class="home__accent">{{ t.home.headlineAccent }}</span>
      </h1>
      <p class="home__lead">{{ t.home.lead }}</p>
    </div>
  </section>
  <div class="home__inner">
    <div class="home__form">
      <!-- Le formulaire est affiché tout de suite (rendu serveur) ; son code, plus lourd,
           ne s'active qu'une fois le navigateur au repos. -->
      @defer (hydrate on idle) {
        <app-search-form (submitted)="onSearch($event)" />
      } @placeholder {
        <div class="home__placeholder"></div>
      }
    </div>
  </div>
</div>
<app-footer />
