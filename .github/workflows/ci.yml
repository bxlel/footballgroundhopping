name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run test:functions
      - run: npm run build
      - run: npx playwright test

  # Les migrations sont rejouées sur un vrai PostGIS, puis testées (supabase/tests).
  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres
      PGOPTIONS: -c search_path=public,extensions
    steps:
      - uses: actions/checkout@v4
      - name: Amorce (rôles et schéma auth fournis par Supabase)
        run: psql -v ON_ERROR_STOP=1 -q -f supabase/tests/00_bootstrap.sql
      - name: Migrations
        run: |
          for file in supabase/migrations/*.sql; do
            echo "→ $file"
            psql -v ON_ERROR_STOP=1 -q -f "$file"
          done
      - name: Tests SQL
        run: |
          for file in supabase/tests/[1-9]*.sql; do
            echo "→ $file"
            psql -v ON_ERROR_STOP=1 -q -f "$file"
          done
